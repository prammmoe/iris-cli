[package]
name = "iris"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
